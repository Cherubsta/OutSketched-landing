<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="mod.css">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <title>OutSketched — Word Bank</title>
</head>

<body>
  <!-- Lightweight local password gate -->
  <div id="loginCard" class="card">
    <h2>Word Bank Admin</h2>
    <p class="subtitle">Enter the admin password.</p>
    <input
      id="passwordInput"
      type="password"
      autocomplete="current-password"
      placeholder="Password"
    >
    <button id="passwordButton" class="primary" style="margin-top:10px;">
      Continue
    </button>
    <div id="passwordError" style="color:#b42318; margin-top:10px;"></div>
  </div>


  <main id="app" class="container hidden">
    <div class="admin-heading">
      <img src="assets/brand-icon.png" alt="">
      <h2>OutSketched: Word Bank</h2>
    </div>
    <p class="subtitle mt-2">
      Manage the live word bank. Add new words, edit, and adjust categories.
    </p>

    <section id="editor" class="hidden">
      <div class="card">
        <div class="field">
          <label for="newWords">Add or Find Word(s)</label>

          <div class="search-wrap">
            <textarea
              id="newWords"
              placeholder="Type or paste words, separated by commas…"
              autocapitalize="none"
              autocorrect="off"
              spellcheck="false"
            ></textarea>

            <div
              id="searchSuggestions"
              class="search-suggestions hidden">
            </div>
          </div>
        </div>

        <div class="row" style="margin-top:12px;">
          <div class="field">
            <label for="categorySelect">Category</label>
            <select id="categorySelect"></select>
          </div>

          <div></div>

          <div class="add-action">
            <button id="addButton" class="primary">
              Add Words
            </button>
            <div class="add-hint">
              Duplicates are skipped automatically.
            </div>
          </div>
        </div>

        <div id="status"></div>

        <div class="word-bank-meta">
          <strong id="totalCount"></strong>
        </div>
      </div>

      <div id="loadingStatus" class="loading-card card hidden">
        <div class="spinner"></div>
        <div>Loading words…</div>
      </div>

      <div id="wordSections"></div>

    </section>

    <section id="cloudKitLogin" class="card">
      <div id="apple-sign-in-button"></div>
      <div id="authStatus" style="color:#777;">
        Checking iCloud sign-in…
      </div>
    </section>

    <section>
      <div id="apple-sign-out-button"></div>
    </section>

  </main>

  <script>
    
    /*
      ---------------------------------------------------
      CONFIGURATION
      ---------------------------------------------------
    */

    const CLOUDKIT_CONTAINER = "iCloud.dev.rainbox.OutSketched";

    // Create this in CloudKit Console → API Access.
    const CLOUDKIT_API_TOKEN = "f5e7c0da6d93b2c0802f601430b4082e418b921e72cfcc3fde72a7c116fffee2";

    const CLOUDKIT_ENVIRONMENT = "production";

    const ADMIN_PASSWORD_HASH =
      "e9ea17b5ccd46a0497599f0d594517fbf1764bdddc7336af6107fb167a1a153a";


    const CATEGORIES = [
      "Everyday Objects",
      "Creatures",
      "Food & Kitchen",
      "Places",
      "Sports",
      "Nature",
      "Transportation",
      "Human Body"
    ];


    /*
      ---------------------------------------------------
      LOCAL PASSWORD GATE
      ---------------------------------------------------
    */

    const ADMIN_AUTH_KEY = "outsketched_wordbank_admin";

    async function sha256(text) {

      const data =
        new TextEncoder().encode(text);

      const hashBuffer =
        await crypto.subtle.digest("SHA-256", data);

      return [...new Uint8Array(hashBuffer)]
        .map(b => b.toString(16).padStart(2, "0"))
        .join("");
    }


    async function attemptPassword() {

      const input =
        document.getElementById("passwordInput").value;

      const hash =
        await sha256(input);

      if (hash === ADMIN_PASSWORD_HASH) {

        localStorage.setItem(
          ADMIN_AUTH_KEY,
          ADMIN_PASSWORD_HASH
        );

        showApp();

      } else {

        document.getElementById("passwordError")
          .textContent = "Incorrect password.";

      }
    }


    function showApp() {

      document.getElementById("loginCard")
        .classList.add("hidden");

      document.getElementById("app")
        .classList.remove("hidden");

      initializeCloudKit();
    }


    document.getElementById("passwordButton")
      .addEventListener("click", attemptPassword);


    document.getElementById("passwordInput")
      .addEventListener("keydown", event => {

        if (event.key === "Enter") {
          attemptPassword();
        }

      });


    if (
      localStorage.getItem(ADMIN_AUTH_KEY) ===
      ADMIN_PASSWORD_HASH
    ) {
      showApp();
    }


    /*
      ---------------------------------------------------
      CLOUDKIT
      ---------------------------------------------------
    */

    let container;
    let database;

    let allWords = [];


    window.addEventListener(
      "cloudkitloaded",
      () => {

        // If password gate already passed,
        // initializeCloudKit() will configure it.

      }
    );


    async function initializeCloudKit() {

      if (!window.CloudKit) {

        // CloudKit script may still be loading.
        setTimeout(initializeCloudKit, 100);
        return;

      }

      CloudKit.configure({

        locale: "en-us",

        containers: [{

          containerIdentifier:
            CLOUDKIT_CONTAINER,

          apiTokenAuth: {

            apiToken:
              CLOUDKIT_API_TOKEN,

            persist: true,

            signInButton: {
              id: "apple-sign-in-button",
              theme: "black"
            },

            signOutButton: {
              id: "apple-sign-out-button",
              theme: "black"
            }

          },

          environment:
            CLOUDKIT_ENVIRONMENT

        }]

      });


      container =
        CloudKit.getDefaultContainer();

      database =
        container.publicCloudDatabase;


      try {

        const identity =
          await container.setUpAuth();

        handleIdentity(identity);


        container.whenUserSignsIn()
          .then(identity => {

            handleIdentity(identity);

          });


        container.whenUserSignsOut()
          .then(() => {

            handleIdentity(null);

          });


      } catch (error) {

        console.error(error);

        document.getElementById("authStatus")
          .textContent =
          "Unable to initialize iCloud authentication.";

      }

    }


    async function handleIdentity(identity) {

      const authStatus =
        document.getElementById("authStatus");

      const editor =
        document.getElementById("editor");


      if (!identity) {

        authStatus.textContent =
          "Sign in to iCloud to manage words.";

        editor.classList.add("hidden");

        return;

      }


      authStatus.textContent =
        "Signed in to iCloud.";

      editor.classList.remove("hidden");


      try {

        await loadWords();

      } catch (error) {

        console.error(error);

        setStatus(
          "Could not load words from CloudKit.",
          true
        );

      }

    }


    /*
      ---------------------------------------------------
      LOAD WORDS
      ---------------------------------------------------
    */

    async function loadWords() {
      
      const loadingStatus =
        document.getElementById("loadingStatus");

      const wordSections =
        document.getElementById("wordSections");

      loadingStatus.classList.remove("hidden");
      wordSections.classList.add("hidden");

      try {
        let response = await database.performQuery({
          recordType: "Word"
        });

        let records = [...(response.records || [])];

        while (response.moreComing || response.continuationMarker) {
          response = await database.performQuery(response);

          if (response.records?.length) {
            records.push(...response.records);
          }
        }

        allWords = records.map(record => ({
          record,

          text:
            record.fields?.text?.value ?? "",

          category:
            record.fields?.category?.value ?? "",

          enabled:
            Number(
              record.fields?.enabled?.value ?? 1
            ) === 1
        }));

        allWords.sort((a, b) =>
          a.text.localeCompare(
            b.text,
            undefined,
            { sensitivity: "base" }
          )
        );

        renderWords();

        loadingStatus.classList.add("hidden");
        wordSections.classList.remove("hidden");

        console.log(
          `[WordBank Admin] Loaded ${allWords.length} CloudKit words`
        );

        setStatus("");

      } catch (error) {

        loadingStatus.classList.add("hidden");

        console.error(
          "[WordBank Admin] Failed to load words:",
          error
        );

        setStatus(
          "Could not load words from CloudKit.",
          true
        );

        throw error;
      }
    }


    /*
      ---------------------------------------------------
      ADD WORDS
      ---------------------------------------------------
    */

    async function addWords() {

      const raw =
        document.getElementById("newWords")
          .value;

      const category =
        document.getElementById("categorySelect")
          .value;


      const incoming =
        raw
          .split(",")
          .map(word => word.trim().toLowerCase())
          .filter(Boolean);


      if (!incoming.length) {
        setStatus("Enter at least one word.", true);
        return;
      }


      const uniqueIncoming =
        [...new Map(
          incoming.map(word => [
            word.toLowerCase(),
            word
          ])
        ).values()];


      const existing =
        new Set(
          allWords
            .filter(word =>
              word.category === category
            )
            .map(word =>
              word.text.toLowerCase()
            )
        );


      const toAdd =
        uniqueIncoming.filter(
          word =>
            !existing.has(
              word.toLowerCase()
            )
        );


      const skipped =
        uniqueIncoming.length -
        toAdd.length;


      if (!toAdd.length) {

        setStatus(
          `${skipped} duplicate${skipped === 1 ? "" : "s"} skipped.`
        );

        return;

      }


      setStatus(
        `Adding ${toAdd.length} word${toAdd.length === 1 ? "" : "s"}…`
      );


      const records =
        toAdd.map(word => ({

          recordType: "Word",

          fields: {

            text: {
              value: word
            },

            category: {
              value: category
            },

            enabled: {
              value: 1
            }

          }

        }));


      try {

        await database.saveRecords(records);

        document.getElementById("newWords")
          .value = "";

        await loadWords();


        setStatus(
          `${toAdd.length} added` +
          (skipped
            ? ` · ${skipped} duplicate${skipped === 1 ? "" : "s"} skipped`
            : "") +
          " ✓"
        );


      } catch (error) {

        console.error(error);

        setStatus(
          "Could not add words.",
          true
        );

      }

    }

    /*
      ---------------------------------------------------
      EDIT
      ---------------------------------------------------
    */

    async function editWord(word) {
      const existing =
        document.getElementById("wordEditOverlay");

      if (existing) {
        existing.remove();
      }

      const overlay =
        document.createElement("div");

      overlay.id =
        "wordEditOverlay";

      overlay.className =
        "edit-overlay";


      const panel =
        document.createElement("div");

      panel.className =
        "edit-panel";


      const title =
        document.createElement("h3");

      title.textContent =
        "Edit Word";


      const textInput =
        document.createElement("input");

      textInput.type =
        "text";

      textInput.value =
        word.text;


      const categorySelect =
        document.createElement("select");

      const enabledLabel =
        document.createElement("label");

      enabledLabel.className =
        "edit-enabled";


      const enabledCheckbox =
        document.createElement("input");

      enabledCheckbox.type =
        "checkbox";

      enabledCheckbox.checked =
        word.enabled;


      enabledLabel.append(
        enabledCheckbox,
        document.createTextNode(" Enabled")
      );

      for (const category of CATEGORIES) {
        const option =
          document.createElement("option");

        option.value =
          category;

        option.textContent =
          category;

        option.selected =
          category === word.category;

        categorySelect.append(option);
      }


      const buttons =
        document.createElement("div");

      buttons.className =
        "edit-actions";


      const save =
        document.createElement("button");

      save.className =
        "primary";

      save.textContent =
        "Save";


      const cancel =
        document.createElement("button");

      cancel.className =
        "secondary";

      cancel.textContent =
        "Cancel";


      const del =
        document.createElement("button");

      del.className =
        "danger";

      del.textContent =
        "Delete";


      cancel.addEventListener(
        "click",
        () => overlay.remove()
      );


      del.addEventListener(
        "click",
        async () => {

          const deleted =
            await deleteWord(word);

          if (deleted) {
            overlay.remove();
          }

        }
      );


      save.addEventListener(
        "click",
        async () => {

          const trimmed =
            textInput.value.trim();

          if (!trimmed) {
            return;
          }

          const updatedRecord = {
            ...word.record,

            fields: {
              ...word.record.fields,

              text: {
                value: trimmed
              },

              category: {
                value: categorySelect.value
              },

              enabled: {
                value:
                  enabledCheckbox.checked ? 1 : 0
              }
            }
          };

          try {

            save.disabled = true;
            save.textContent = "Saving…";

            await database.saveRecords(
              updatedRecord
            );

            overlay.remove();

            await loadWords();

            setStatus("Saved ✓");

          } catch (error) {

            console.error(error);

            save.disabled = false;
            save.textContent = "Save";

            setStatus(
              "Could not save changes.",
              true
            );

          }

        }
      );


      buttons.append(
        save,
        cancel,
        del
      );


      panel.append(
        title,
        textInput,
        categorySelect,
        enabledLabel,
        buttons
      );


      overlay.append(panel);

      document.body.append(overlay);

      textInput.focus();
      textInput.select();
    }


    /*
      ---------------------------------------------------
      DELETE
      ---------------------------------------------------
    */

    async function deleteWord(word) {

      const confirmed =
        confirm(
          `Delete "${word.text}"?`
        );

      if (!confirmed) {
        return false;
      }


      try {

        await database.deleteRecords([
          word.record.recordName
        ]);

        await loadWords();

        setStatus("Deleted ✓");

        return true;


      } catch (error) {

        console.error(error);

        setStatus(
          "Could not delete word.",
          true
        );

        return false;

      }

    }


    /*
      ---------------------------------------------------
      RENDER
      ---------------------------------------------------
    */

    function renderWords() {

      const container =
        document.getElementById("wordSections");

      container.innerHTML = "";

      document.getElementById(
        "totalCount"
      ).textContent =
        `${allWords.length} words`;


      for (const category of CATEGORIES) {

        const words =
          allWords.filter(
            word => word.category === category
          );

        const section =
          document.createElement("section");

        section.className =
          "category card";


        const header =
          document.createElement("div");

        header.className =
          "category-header";


        const heading =
          document.createElement("h2");

        heading.textContent =
          category;


        const count =
          document.createElement("span");

        count.className =
          "count";

        count.textContent =
          `${words.length} word${words.length === 1 ? "" : "s"}`;


        header.append(
          heading,
          count
        );

        section.append(header);


        const grid =
          document.createElement("div");

        grid.className =
          "words-grid";


        for (const word of words) {

          const row =
            document.createElement("div");

          row.className =
            "word-row";

          const label =
            document.createElement("div");

          label.className =
            "word-text";

          label.textContent =
            word.text;


          if (!word.enabled) {
            label.classList.add(
              "word-disabled"
            );
          }


          const edit =
            document.createElement("button");

          edit.className =
            "secondary edit-button";

          edit.textContent =
            "Edit";

          edit.addEventListener(
            "click",
            () => editWord(word)
          );


          row.append(
            edit,
            label
          );
          grid.append(row);
        }

        section.append(grid);

        container.append(section);

      }

    }


    /*
      ---------------------------------------------------
      UI HELPERS
      ---------------------------------------------------
    */

    function populateCategories() {

      const select =
        document.getElementById(
          "categorySelect"
        );


      CATEGORIES.forEach(category => {

        const option =
          document.createElement("option");

        option.value =
          category;

        option.textContent =
          category;

        select.append(option);

      });

    }


    function setStatus(
      message,
      isError = false
    ) {

      const status =
        document.getElementById("status");

      status.textContent =
        message;

      status.style.color =
        isError
          ? "#b42318"
          : "#777";

    }


    populateCategories();


    document.getElementById("addButton")
      .addEventListener(
        "click",
        addWords
      );

    // Event listeners
    // Add / find word autosuggest
    document
      .getElementById("newWords")
      .addEventListener("input", function () {

        const suggestions =
          document.getElementById("searchSuggestions");

        const activeWord =
          this.value
            .split(",")
            .pop()
            .trim();

        const search =
          activeWord.toLowerCase();

        if (!search) {
          suggestions.classList.add("hidden");
          suggestions.innerHTML = "";
          return;
        }

        const matches =
          allWords
            .filter(word =>
              word.text
                .toLowerCase()
                .includes(search)
            )
            .slice(0, 8);

        suggestions.innerHTML = "";

        for (const word of matches) {

          const item =
            document.createElement("div");

          item.className =
            "search-suggestion";

          item.innerHTML =
            `${word.text}<small>${word.category}</small>`;

          item.addEventListener(
            "click",
            () => {
              suggestions.classList.add("hidden");
              editWord(word);
            }
          );

          suggestions.append(item);
        }

        if (matches.length) {
          suggestions.classList.remove("hidden");
        } else {
          suggestions.classList.add("hidden");
        }

      });

    // Dismiss suggestions when tapping elsewhere
    document.addEventListener("pointerdown", function (event) {

      const searchWrap =
        document.querySelector(".search-wrap");

      const wordInput =
        document.getElementById("newWords");

      const suggestions =
        document.getElementById("searchSuggestions");

      if (!searchWrap.contains(event.target)) {
        wordInput.blur();
        suggestions.classList.add("hidden");
      }

    });

  </script>


  <!-- Apple CloudKit JS -->
  <script
    src="https://cdn.apple-cloudkit.com/ck/2/cloudkit.js"
    async>
  </script>

</body>
</html>
